name: Direct IP App CI
# Trigger run marker (no-op edit)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies (portaudio and build tools)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libportaudio2 build-essential gcc python3-dev libsndfile1-dev libasound2-dev
          apt-cache policy portaudio19-dev || true

      - name: Upgrade pip and install Python deps
        run: |
          set -eux
          python -m pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir pyaudio pyinstaller

      - name: Syntax check direct_ip_call.py
        run: |
          python -m py_compile direct_ip_call.py

      - name: Socket bind test (UDP)
        run: |
          python - <<'PY'
import socket
s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
try:
    s.bind(("0.0.0.0", 0))
    print("Socket bind successful")
finally:
    s.close()
PY

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --onefile direct_ip_call.py

      - name: List built files
        run: ls -la dist || true

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: direct-ip-executable
          path: dist/*
