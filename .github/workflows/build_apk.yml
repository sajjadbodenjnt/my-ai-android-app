name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git zip unzip openjdk-11-jdk zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev libjpeg-dev libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libglu1-mesa-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build APK with buildozer
        uses: kivy/buildozer-action@v1
        with:
          python-version: '3.10'
          target: 'android'
          apk: true
          extra_args: |
            --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: direct-ip-apk
          path: bin/*/*.apk
