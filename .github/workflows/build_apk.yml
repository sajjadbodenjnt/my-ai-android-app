name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git zip unzip wget tar openjdk-11-jdk zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libffi-dev libsqlite3-dev libjpeg-dev libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libglu1-mesa-dev libltdl-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf automake libtool m4 pkg-config gettext autoconf-archive libtool-bin

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configure Android SDK env
        run: |
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> $GITHUB_ENV

      - name: Install Android SDK command-line tools and platform/build-tools
        run: |
          set -eux
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR"
          cd "$SDK_DIR"
          # Download latest commandline tools (version number stable as of 2024; if it changes update URL)
          CLI_ZIP="commandlinetools-linux-9477386_latest.zip"
          wget -q "https://dl.google.com/android/repository/${CLI_ZIP}" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools
          # place in expected path
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK_DIR" --licenses || true
          sdkmanager --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Verify Android tools
        run: |
          set -eux
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          echo "SDK_DIR=$SDK_DIR"
          ls -la "$SDK_DIR"
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --list --sdk_root="$SDK_DIR"

      - name: Install pip deps for build
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install --user buildozer cython
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Link SDK to buildozer path
        run: |
          set -eux
          mkdir -p "$HOME/.buildozer/android/platform"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk" || true
          ln -s "$RUNNER_TEMP/android-sdk" "$HOME/.buildozer/android/platform/android-sdk"
          # Create legacy tools/bin path expected by older buildozer/p4a and symlink sdkmanager
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"
          if [ -x "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$RUNNER_TEMP/android-sdk/cmdline-tools/latest/bin/sdkmanager" "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          fi

      - name: Build APK with buildozer
        run: |
          set -eux
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: direct-ip-apk
          path: bin/*/*.apk
